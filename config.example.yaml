# ─────────────────────────────────────────────────────────────────────────────
# config.example.yaml  —  reference template (tracked in git)
#
# config.yaml is git-ignored so each machine has its own copy.
# Copy this file to config.yaml and fill in the values for your environment.
#
#   cp config.example.yaml config.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── LOCAL DEV (Mac, webcam) ───────────────────────────────────────────────────
