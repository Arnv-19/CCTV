name: CI/CD Pipeline

# ──────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ──────────────────────────────────────────────────────────────
# Jobs
# ──────────────────────────────────────────────────────────────
jobs:

  # ── JOB 1: Lint ────────────────────────────────────────────
  lint:
    name: "Lint (flake8 + black)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install flake8 black

      - name: black — format check
        run: |
          black --check --diff \
            app/ \
            camera_worker.py \
            alarm.py \
            detector.py

      - name: flake8 — style check
        run: |
          flake8 \
            app/ \
            camera_worker.py \
            alarm.py \
            detector.py \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --exclude=.venv,__pycache__,.git

  # ── JOB 2: Test ────────────────────────────────────────────
  test:
    name: "Unit Tests (pytest)"
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///./test.db"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      APP_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only torch (faster CI)
        run: |
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu \
            --quiet

      - name: Install project dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest-cov

      - name: Run pytest
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short \
            -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── JOB 3: Deploy (push to main only) ──────────────────────
  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Load SSH key into the agent for this job
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Trust the target host — avoids interactive prompt
      - name: Add host to known_hosts
        run: |
          ssh-keyscan \
            -H \
            -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.SSH_HOST }} \
            >> ~/.ssh/known_hosts

      # Stream the deploy script to the remote shell.
      # Positional args are expanded locally (in the GH runner) before SSH
      # sends them, so secrets never appear in the remote shell's history.
      - name: Deploy
        id: deploy
        run: |
          ssh \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$APP_DIR' '$SERVICE_NAME' '$APP_PORT'" \
            < scripts/deploy/remote_deploy.sh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR:  ${{ secrets.APP_DIR }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
          APP_PORT: ${{ secrets.APP_PORT || '8000' }}

      - name: Deployment succeeded
        if: success()
        run: |
          echo "::notice title=Deploy OK::Service is live on ${{ secrets.SSH_HOST }}"

      - name: Deployment failed
        if: failure()
        run: |
          echo "::error title=Deploy FAILED::Health check failed — rollback triggered. Check server logs at ${{ secrets.APP_DIR }}/logs/deploy.log"
